name: build ml kit android

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build ML Kit Android samples
        run: |
          chmod +x java/ml_kit/android/latest/build.sh
          java/ml_kit/android/latest/build.sh
